<style>
  :root {
    color-scheme: light;
    --bg: #fafafa;
    --card-bg: #ffffff;
    --border: #e4e4e7;
    --text: #18181b;
    --text-muted: #71717a;
    --accent: #18181b;
    --accent-contrast: #ffffff;
    --pink-bg: #fce7f3;
    --pink-text: #be185d;
    --amber-bg: #fef3c7;
    --amber-text: #b45309;
    --danger: #dc2626;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
  }

  .app-header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .app-header h1 {
    font-size: 18px;
    margin: 0;
  }

  .tabs {
    display: flex;
    gap: 4px;
    background: var(--bg);
    padding: 4px;
    border-radius: 10px;
  }

  .tab-btn {
    border: none;
    background: transparent;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: var(--text-muted);
  }

  .tab-btn.active {
    background: var(--accent);
    color: var(--accent-contrast);
  }

  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 16px;
  }

  .field-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
    margin-bottom: 4px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .field.wide {
    grid-column: 1 / -1;
  }

  .field-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
  }

  .required {
    color: var(--danger);
    font-weight: 700;
    font-size: 11px;
  }

  .help-text {
    font-size: 11px;
    color: var(--text-muted);
  }

  input[type="text"],
  input[type="date"],
  input[type="month"],
  input[type="search"],
  select,
  textarea {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 14px;
    font-family: inherit;
    background: var(--card-bg);
    color: var(--text);
    width: 100%;
  }

  textarea {
    resize: vertical;
  }

  .section {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin: 14px 0;
  }

  .section summary {
    font-weight: 700;
    cursor: pointer;
    padding: 4px 0;
  }

  .section[open] summary {
    margin-bottom: 8px;
  }

  .form-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  .spacer {
    flex: 1;
  }

  .btn {
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .btn-primary {
    background: var(--accent);
    color: var(--accent-contrast);
  }

  .btn-primary:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }

  .btn-danger {
    background: transparent;
    border: 1px solid #fecaca;
    color: var(--danger);
  }

  .list-toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  #searchInput {
    max-width: 320px;
  }

  .list-count {
    font-size: 12px;
    color: var(--text-muted);
  }

  .table-wrap {
    overflow-x: auto;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
  }

  table {
    border-collapse: collapse;
    width: 100%;
    min-width: 720px;
  }

  thead {
    background: var(--bg);
  }

  th, td {
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    font-size: 13px;
  }

  th[data-sort] {
    cursor: pointer;
    user-select: none;
  }

  th[data-sort]:hover {
    color: var(--text);
  }

  tbody tr {
    cursor: pointer;
  }

  tbody tr:hover {
    background: var(--bg);
  }

  tbody tr:last-child td {
    border-bottom: none;
  }

  .friend-name {
    font-weight: 600;
  }

  .badge {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
  }

  .badge-pink {
    background: var(--pink-bg);
    color: var(--pink-text);
  }

  .badge-amber {
    background: var(--amber-bg);
    color: var(--amber-text);
  }

  .empty-row td {
    text-align: center;
    color: var(--text-muted);
    padding: 32px 12px;
  }

  .toast {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: var(--accent-contrast);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    z-index: 100;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  }

  .toast.error {
    background: var(--danger);
  }

  .view[hidden] {
    display: none;
  }
</style>
