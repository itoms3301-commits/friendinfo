<script>
(function () {
  'use strict';

  var BOOK_STATUS_OPTIONS = [];
  var CIRCLE_STATUS_OPTIONS = [];
  var CURRENT_STAGE_OPTIONS = [];

  var friends = [];
  var sortKey = 'birthday';
  var sortDir = 'asc';
  var searchText = '';

  var formEl = document.getElementById('friendForm');
  var submitBtn = document.getElementById('submitBtn');
  var deleteBtn = document.getElementById('deleteBtn');
  var cancelEditBtn = document.getElementById('cancelEditBtn');
  var idInput = document.getElementById('f-id');
  var nameInput = document.getElementById('f-name');
  var tabBtnForm = document.getElementById('tabBtnForm');
  var tabBtnList = document.getElementById('tabBtnList');
  var viewForm = document.getElementById('view-form');
  var viewList = document.getElementById('view-list');
  var searchInput = document.getElementById('searchInput');
  var tableBody = document.getElementById('friendsTableBody');
  var listCount = document.getElementById('listCount');
  var openSheetBtn = document.getElementById('openSheetBtn');

  // ---------- 初期化 ----------

  function init() {
    google.script.run.withSuccessHandler(onConfigLoaded).withFailureHandler(onError).getFormConfig();
    loadFriends();

    tabBtnForm.addEventListener('click', function () { showTab('form'); });
    tabBtnList.addEventListener('click', function () { showTab('list'); });

    formEl.addEventListener('submit', handleSubmit);
    deleteBtn.addEventListener('click', handleDelete);
    cancelEditBtn.addEventListener('click', function () { resetForm(); });

    searchInput.addEventListener('input', function (e) {
      searchText = e.target.value;
      renderTable();
    });

    document.querySelectorAll('th[data-sort]').forEach(function (th) {
      th.addEventListener('click', function () {
        var key = th.getAttribute('data-sort');
        if (sortKey === key) {
          sortDir = sortDir === 'asc' ? 'desc' : 'asc';
        } else {
          sortKey = key;
          sortDir = 'asc';
        }
        renderTable();
      });
    });

    openSheetBtn.addEventListener('click', function () {
      google.script.run.withSuccessHandler(function (url) {
        window.open(url, '_blank');
      }).withFailureHandler(onError).getSpreadsheetUrl();
    });
  }

  function onConfigLoaded(config) {
    BOOK_STATUS_OPTIONS = config.bookStatusOptions;
    CIRCLE_STATUS_OPTIONS = config.circleStatusOptions;
    CURRENT_STAGE_OPTIONS = config.currentStageOptions;
    fillSelect('f-bookStatus', BOOK_STATUS_OPTIONS);
    fillSelect('f-circleStatus', CIRCLE_STATUS_OPTIONS);
    fillSelect('f-currentStage', CURRENT_STAGE_OPTIONS);
  }

  function fillSelect(id, options) {
    var select = document.getElementById(id);
    select.innerHTML = '';
    var blank = document.createElement('option');
    blank.value = '';
    blank.textContent = '未選択';
    select.appendChild(blank);
    options.forEach(function (opt) {
      var el = document.createElement('option');
      el.value = opt;
      el.textContent = opt;
      select.appendChild(el);
    });
  }

  function loadFriends() {
    google.script.run.withSuccessHandler(function (data) {
      friends = data || [];
      renderTable();
    }).withFailureHandler(onError).listFriends();
  }

  // ---------- タブ切り替え ----------

  function showTab(tab) {
    var isForm = tab === 'form';
    viewForm.hidden = !isForm;
    viewList.hidden = isForm;
    tabBtnForm.classList.toggle('active', isForm);
    tabBtnList.classList.toggle('active', !isForm);
  }

  // ---------- フォーム送信 ----------

  function handleSubmit(e) {
    e.preventDefault();
    var data = {};
    new FormData(formEl).forEach(function (value, key) {
      data[key] = value;
    });

    if (!data.name || !data.name.trim()) {
      showToast('名前を入力してください', true);
      nameInput.focus();
      return;
    }

    var isEditing = !!data.id;
    submitBtn.disabled = true;
    submitBtn.textContent = '保存中…';

    google.script.run
      .withSuccessHandler(function (saved) {
        submitBtn.disabled = false;
        submitBtn.textContent = idInput.value ? '更新する' : '登録する';
        loadFriends();
        if (isEditing) {
          showToast('更新しました');
          resetForm();
          showTab('list');
        } else {
          showToast('登録しました。続けて次の友達を登録できます');
          resetForm();
          nameInput.focus();
        }
      })
      .withFailureHandler(function (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = idInput.value ? '更新する' : '登録する';
        onError(err);
      })
      .saveFriend(data);
  }

  function resetForm() {
    formEl.reset();
    idInput.value = '';
    deleteBtn.hidden = true;
    cancelEditBtn.hidden = true;
    submitBtn.textContent = '登録する';
    document.querySelectorAll('#friendForm details.section').forEach(function (d) {
      d.open = false;
    });
    document.querySelector('#friendForm details.section').open = true;
  }

  function handleDelete() {
    var id = idInput.value;
    if (!id) return;
    if (!window.confirm('この友達の情報を削除しますか？この操作は取り消せません。')) return;

    deleteBtn.disabled = true;
    google.script.run
      .withSuccessHandler(function () {
        deleteBtn.disabled = false;
        loadFriends();
        resetForm();
        showTab('list');
        showToast('削除しました');
      })
      .withFailureHandler(function (err) {
        deleteBtn.disabled = false;
        onError(err);
      })
      .deleteFriend(id);
  }

  // ---------- 一覧・検索・並び替え ----------

  function openEditor(friend) {
    resetForm();
    Object.keys(friend).forEach(function (key) {
      var el = formEl.elements.namedItem(key);
      if (!el) return;
      el.value = friend[key] || '';
    });
    idInput.value = friend.id;
    deleteBtn.hidden = false;
    cancelEditBtn.hidden = false;
    submitBtn.textContent = '更新する';
    document.querySelectorAll('#friendForm details.section').forEach(function (d) {
      d.open = true;
    });
    showTab('form');
  }

  function daysUntilNextBirthday(birthday) {
    if (!birthday) return null;
    var parts = birthday.split('-').map(Number);
    if (parts.length !== 3 || parts.some(isNaN)) return null;
    var month = parts[1];
    var day = parts[2];
    var today = new Date();
    today = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    var next = new Date(today.getFullYear(), month - 1, day);
    if (next < today) next = new Date(today.getFullYear() + 1, month - 1, day);
    return Math.round((next.getTime() - today.getTime()) / 86400000);
  }

  function monthsFromNow(yearMonth) {
    if (!yearMonth) return null;
    var parts = yearMonth.split('-').map(Number);
    if (parts.length !== 2 || parts.some(isNaN)) return null;
    var today = new Date();
    return (parts[0] - today.getFullYear()) * 12 + (parts[1] - 1 - today.getMonth());
  }

  function upcomingSortKey(value) {
    if (value === null || value === undefined) return Infinity;
    return value >= 0 ? value : 1000000 - value;
  }

  function rankOf(options, value) {
    var idx = options.indexOf(value);
    return idx === -1 ? options.length : idx;
  }

  function formatBirthday(birthday) {
    if (!birthday) return '-';
    var parts = birthday.split('-');
    if (parts.length !== 3) return birthday;
    return Number(parts[1]) + '月' + Number(parts[2]) + '日';
  }

  function formatMoveOutMonth(value) {
    if (!value) return '-';
    var parts = value.split('-');
    if (parts.length !== 2) return value;
    return parts[0] + '年' + Number(parts[1]) + '月';
  }

  function birthdayBadge(birthday) {
    var days = daysUntilNextBirthday(birthday);
    if (days === null) return null;
    if (days === 0) return { text: '🎉 今日', cls: 'badge-pink' };
    if (days <= 30) return { text: 'あと' + days + '日', cls: 'badge-pink' };
    return null;
  }

  function moveOutBadge(value) {
    var months = monthsFromNow(value);
    if (months === null) return null;
    if (months < 0) return { text: '退去済', cls: 'badge-amber' };
    if (months === 0) return { text: '今月', cls: 'badge-amber' };
    if (months <= 3) return { text: 'あと' + months + 'ヶ月', cls: 'badge-amber' };
    return null;
  }

  function matchesSearch(friend, text) {
    if (!text) return true;
    var haystack = (friend.name + ' ' + friend.relationship + ' ' + friend.memo).toLowerCase();
    return haystack.indexOf(text.toLowerCase()) !== -1;
  }

  function sortKeyValue(friend, key) {
    switch (key) {
      case 'name':
        return friend.name || '';
      case 'birthday':
        return upcomingSortKey(daysUntilNextBirthday(friend.birthday));
      case 'moveOutMonth':
        return upcomingSortKey(monthsFromNow(friend.moveOutMonth));
      case 'bookStatus':
        return rankOf(BOOK_STATUS_OPTIONS, friend.bookStatus || '');
      case 'circleStatus':
        return rankOf(CIRCLE_STATUS_OPTIONS, friend.circleStatus || '');
      case 'currentStage':
        return rankOf(CURRENT_STAGE_OPTIONS, friend.currentStage || '');
      case 'updatedAt':
      default:
        return friend.updatedAt || '';
    }
  }

  function renderTable() {
    var filtered = friends.filter(function (f) { return matchesSearch(f, searchText); });

    filtered.sort(function (a, b) {
      var ka = sortKeyValue(a, sortKey);
      var kb = sortKeyValue(b, sortKey);
      var cmp;
      if (ka < kb) cmp = -1;
      else if (ka > kb) cmp = 1;
      else cmp = (a.name || '').localeCompare(b.name || '', 'ja');
      return sortDir === 'asc' ? cmp : -cmp;
    });

    listCount.textContent = filtered.length + ' / ' + friends.length + '人';

    tableBody.innerHTML = '';

    if (filtered.length === 0) {
      var tr = document.createElement('tr');
      tr.className = 'empty-row';
      var td = document.createElement('td');
      td.colSpan = 8;
      td.textContent = friends.length === 0
        ? 'まだ友達が登録されていません。「＋ 登録」タブから追加しましょう。'
        : '該当する友達が見つかりませんでした。';
      tr.appendChild(td);
      tableBody.appendChild(tr);
      return;
    }

    filtered.forEach(function (friend) {
      var tr = document.createElement('tr');
      tr.addEventListener('click', function () { openEditor(friend); });

      tr.appendChild(makeCell(friend.name || '(名前未登録)', 'friend-name'));
      tr.appendChild(makeCell(friend.relationship || '-'));
      tr.appendChild(makeBadgeCell(formatBirthday(friend.birthday), birthdayBadge(friend.birthday)));
      tr.appendChild(makeBadgeCell(formatMoveOutMonth(friend.moveOutMonth), moveOutBadge(friend.moveOutMonth)));
      tr.appendChild(makeCell(friend.bookStatus || '未'));
      tr.appendChild(makeCell(friend.circleStatus || '未'));
      tr.appendChild(makeCell(friend.currentStage || '-'));
      tr.appendChild(makeCell(friend.updatedAt ? new Date(friend.updatedAt).toLocaleDateString('ja-JP') : '-'));

      tableBody.appendChild(tr);
    });
  }

  function makeCell(text, cls) {
    var td = document.createElement('td');
    td.textContent = text;
    if (cls) td.className = cls;
    return td;
  }

  function makeBadgeCell(text, badge) {
    var td = document.createElement('td');
    td.appendChild(document.createTextNode(text));
    if (badge) {
      var span = document.createElement('span');
      span.className = 'badge ' + badge.cls;
      span.textContent = badge.text;
      td.appendChild(span);
    }
    return td;
  }

  // ---------- ユーティリティ ----------

  var toastTimer = null;
  function showToast(message, isError) {
    var toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = 'toast' + (isError ? ' error' : '');
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.hidden = true; }, 3000);
  }

  function onError(err) {
    console.error(err);
    showToast((err && err.message) ? err.message : 'エラーが発生しました', true);
  }

  init();
})();
</script>
